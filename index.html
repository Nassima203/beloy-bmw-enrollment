<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- The <title> is set by js/router.js from the copy file, so it stays empty here. -->
  <title></title>

  <!-- Inter: free substitute for BMW Type Next (see notes/brand.md, "Typography"). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Every visible string is filled from i18n/<lang>.json through data-i18n. -->
  <a class="skip-link" href="#app" data-i18n="flow.common.skipLink"></a>

  <header class="site-header">
    <div class="container site-header__inner">
      <!-- Wordmark stand-in: text only, no roundel (brief, "The brand"). -->
      <a class="wordmark" href="#/">
        <span class="wordmark__brand" data-i18n="flow.common.brandName"></span>
        <span class="wordmark__product" data-i18n="flow.common.productName"></span>
      </a>

      <div class="site-header__controls">
        <div class="lang-switch" role="group" aria-labelledby="lang-switch-label">
          <span id="lang-switch-label" class="visually-hidden" data-i18n="flow.common.languageLabel"></span>
          <!-- Accessible name is "EN English" / "FR Français": it contains the visible text. -->
          <button type="button" class="lang-switch__option" data-lang="en" lang="en" aria-pressed="false">
            <span data-i18n="flow.common.languageEnShort"></span>
            <span class="visually-hidden" data-i18n="flow.common.languageEn"></span>
          </button>
          <button type="button" class="lang-switch__option" data-lang="fr" lang="fr" aria-pressed="false">
            <span data-i18n="flow.common.languageFrShort"></span>
            <span class="visually-hidden" data-i18n="flow.common.languageFr"></span>
          </button>
        </div>

        <!-- Shows the icon of the theme you will switch to; the label says it in words. -->
        <button type="button" class="icon-button theme-toggle" id="theme-toggle">
          <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="visually-hidden" id="theme-toggle-label"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Back button and "Step X of 6", filled by js/main.js. -->
  <div class="flow-bar">
    <div class="container flow-bar__inner">
      <div class="flow-bar__back" id="back-slot"></div>
      <div class="flow-bar__stepper" id="stepper-slot"></div>
    </div>
  </div>

  <!-- js/router.js renders one screen in here. tabindex="-1" lets the skip link focus it. -->
  <main id="app" class="container page" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer__text" data-i18n="flow.common.insurerLine"></p>
    </div>
  </footer>
</body>
</html>
